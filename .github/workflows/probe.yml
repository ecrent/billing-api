name: Token probe
on:
  workflow_dispatch:
permissions:
  security-events: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Dependabot alerts API with GITHUB_TOKEN
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ecrent/billing-api/dependabot/alerts?state=open&per_page=5")
          echo "HTTP $code"
          head -c 500 /tmp/out.json
