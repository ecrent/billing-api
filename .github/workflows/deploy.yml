name: Build & Deploy API

# CI triggers this workflow after it completes. This is safe ONLY because of
# two guards — without them this trigger is the classic "pwn request" (a fork
# PR from a branch named "main" would get built, pushed as :latest with this
# repo's packages:write token, and SSH-deployed to the VPS):
#   1. job-level: the triggering CI run must come from THIS repository, not a
#      fork (head_repository.full_name == github.repository).
#   2. step-level: the triggering commit must be an ancestor of origin/main —
#      proven with a real `git fetch <sha>`, which FAILS for any commit that
#      is not reachable in this repo (i.e. any fork commit).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ecrent/billing-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering commit is a push to main
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet origin "$SHA" || {
            echo "Commit $SHA is not reachable in this repository (fork commit?) — refusing to deploy" >&2
            exit 1
          }
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "Commit $SHA is not on main — refusing to deploy" >&2
            exit 1
          }
          git checkout --quiet "$SHA"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash -lc '
              cd /opt/eanil/compose

              # Activate billing-api nginx config on first deploy
              if [ -f /opt/eanil/nginx/conf.d/billing-api.conf.disabled ]; then
                mv /opt/eanil/nginx/conf.d/billing-api.conf.disabled \
                   /opt/eanil/nginx/conf.d/billing-api.conf
              fi

              docker pull ghcr.io/ecrent/billing-api:latest
              docker compose up -d --force-recreate billing-api
              docker compose exec -T nginx nginx -s reload

              docker image prune -f
            '
