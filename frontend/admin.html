<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Billing API</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        Billing API
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">Admin</div>
        <a class="nav-item active" data-page="tenants">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Tenants
        </a>
        <a class="nav-item" data-page="plans">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          Plans
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar" id="user-avatar" style="background:#ef4444;">A</div>
          <div class="user-meta">
            <div style="font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px;">ADMIN</div>
            <div class="user-email" id="user-email">loading…</div>
          </div>
        </div>
        <button class="logout-btn" id="logout-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">

      <!-- Tenants -->
      <div id="tenants" class="page active">
        <div class="page-header">
          <h2>Tenants</h2>
          <p>All registered tenant accounts.</p>
        </div>
        <div class="card">
          <div id="tenants-list"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Plans -->
      <div id="plans" class="page">
        <div class="page-header">
          <h2>Plans</h2>
          <p>Available subscription plans.</p>
        </div>
        <div class="card">
          <div id="plans-list"><div class="spinner"></div></div>
        </div>
      </div>

    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
